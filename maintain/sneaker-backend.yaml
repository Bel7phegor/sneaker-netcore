apiVersion: apps/v1
kind: Deployment
metadata:
  name: sneaker-backend-deployment
  namespace: sneaker-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sneaker-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: sneaker-backend
    spec:
      containers:
        - name: sneaker-backend
          image: 250830191861.dkr.ecr.ap-southeast-1.amazonaws.com/onlineshop/sneaker-netcore:latest
          ports:
            - containerPort: 5214

---
apiVersion: v1
kind: Service
metadata:
  name: sneaker-backend-service
  namespace: sneaker-shop
spec:
  type: ClusterIP
  selector:
    app: sneaker-backend
  ports:
    - protocol: TCP
      port: 5214
      targetPort: 5214
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sneaker-backend-ingress
  namespace: sneaker-shop
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: sneaker.anphuc.site
      http:
        paths:
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific 
          backend:
            service:
              name: sneaker-backend-service 
              port:
                number: 5214